<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Despesas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0F1B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --navy-900:#0F1B2C;
  --navy-800:#16263D;
  --navy-700:#1E3252;
  --bg:#E9EDE9;
  --surface:#FFFFFF;
  --ink:#16233A;
  --ink-soft:#5B6B7C;
  --rule:#DDE3DE;
  --blue:#2F6FEB;
  --green:#2F8F5B;
  --red:#C13A3A;
  --amber:#C1791F;
  --romerio:#6B4A63;
  --boaesp:#3F6B4A;
  --alvorada:#8A5A34;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
#app{max-width:1180px;margin:0 auto;padding:0 0 60px;}

.topbar{background:var(--navy-900);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.topbar h1{font-family:'Zilla Slab',serif;font-size:23px;font-weight:600;margin:0;}
.topbar .sub{font-size:12px;color:#9FB0C4;margin-top:3px;display:flex;align-items:center;gap:6px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;}
.topbar .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{border:none;border-radius:5px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#2559c4;}
.btn-ghost{background:var(--navy-700);color:#fff;}
.btn-ghost:hover{background:#28405f;}
.btn-green{background:var(--green);color:#fff;}

.dropdown-wrap{position:relative;}
.export-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--rule);border-radius:7px;box-shadow:0 10px 28px rgba(0,0,0,.18);min-width:250px;z-index:60;overflow:hidden;}
.export-menu .group-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);padding:9px 14px 4px;}
.export-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink);font-family:'Inter',sans-serif;}
.export-menu button:hover:not(:disabled){background:#F1F4F1;}
.export-menu button:disabled{color:#B7C0C7;cursor:not-allowed;}
.export-menu .divider{border-top:1px solid var(--rule);margin:4px 0;}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px 24px 0;}
.card{background:var(--surface);border-radius:8px;padding:16px 18px;border:1px solid var(--rule);}
.card .label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
.card .value{font-family:'Zilla Slab',serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;}
.card.vencidas .value{color:var(--red);}
.card.hoje .value{color:var(--amber);}

.filterbar{background:var(--navy-800);margin:20px 24px 0;border-radius:8px;padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.filterbar select,.filterbar input{background:var(--navy-700);border:1px solid #33506f;color:#fff;border-radius:5px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;}
.filterbar input::placeholder{color:#8FA3BB;}
.filterbar select{color:#fff;}
.filterbar .grow{flex:1;min-width:160px;}
.filterbar .clear{background:transparent;color:#9FB0C4;border:none;font-size:12.5px;cursor:pointer;text-decoration:underline;}

.statusbar{display:flex;justify-content:space-between;align-items:center;margin:12px 24px 0;flex-wrap:wrap;gap:10px;}
.status-chips{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;}
.status-chips label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-soft);}
.status-chips input{accent-color:var(--blue);}
.status-chips .desmarcar{color:var(--blue);cursor:pointer;font-size:12.5px;text-decoration:underline;}
.right-actions{display:flex;gap:8px;}

.tablewrap{margin:16px 24px 0;background:var(--surface);border-radius:8px;border:1px solid var(--rule);overflow:hidden;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;padding:11px 14px;font-size:11.5px;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--rule);background:#F5F7F5;white-space:nowrap;}
tbody td{padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBF9;}
.fornecedor{font-weight:500;}
.fornecedor .plano-tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;color:#fff;margin-top:4px;}
.valor-cell{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
.date-cell{font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap;}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.badge.em-aberto{background:#E4ECFB;color:var(--blue);}
.badge.vencida{background:#FBE6E6;color:var(--red);animation:blink-red 1.1s ease-in-out infinite;}
.badge.paga{background:#E3F3EA;color:var(--green);}
.badge.vence-hoje{background:#FBEEDB;color:var(--amber);animation:blink-amber 1.1s ease-in-out infinite;}

@keyframes blink-red{
  0%, 100%{ background:#FBE6E6; color:var(--red); }
  50%{ background:var(--red); color:#fff; }
}
@keyframes blink-amber{
  0%, 100%{ background:#FBEEDB; color:var(--amber); }
  50%{ background:var(--amber); color:#fff; }
}
@media (prefers-reduced-motion: reduce){
  .badge.vencida, .badge.vence-hoje{ animation:none; }
}
.acoes{display:flex;gap:8px;}
.icon-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--rule);background:#fff;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-soft);}
.icon-btn.danger:hover{color:var(--red);border-color:var(--red);}
.empty-row td{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-row b{display:block;font-family:'Zilla Slab',serif;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:600;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,27,44,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:70;overflow:auto;}
.modal{background:#fff;border-radius:10px;padding:22px;max-width:480px;width:100%;}
.modal h2{font-family:'Zilla Slab',serif;font-size:18px;margin:0 0 16px;font-weight:600;}
.tipo-toggle{display:flex;border:1px solid var(--ink);border-radius:5px;overflow:hidden;width:fit-content;margin-bottom:16px;}
.tipo-toggle button{border:none;background:#fff;color:var(--ink-soft);padding:7px 16px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;}
.tipo-toggle button.active{background:var(--ink);color:#fff;}
.tipo-toggle button:not(:last-child){border-right:1px solid var(--ink);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:5px;font-size:13.5px;font-family:'Inter',sans-serif;}
.field textarea{resize:vertical;min-height:62px;line-height:1.4;}
.field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.4;}
.field .hint .link{color:var(--blue);cursor:pointer;text-decoration:underline;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.btn-outline{background:#fff;border:1px solid var(--rule);color:var(--ink-soft);}

/* Forma de pagamento: dá pra marcar mais de uma (Dinheiro + Pix, Dinheiro + Cartão...) */
.field .formas-chips{display:flex;flex-wrap:wrap;gap:8px;}
.field .forma-chip{display:inline-flex;align-items:center;gap:7px;margin:0;padding:8px 12px;border:1px solid var(--rule);border-radius:20px;font-size:13px;font-weight:500;color:var(--ink);background:#fff;cursor:pointer;user-select:none;-webkit-user-select:none;}
.field .forma-chip input{width:16px;height:16px;padding:0;margin:0;flex-shrink:0;accent-color:var(--blue);cursor:pointer;}
.field .forma-chip:has(input:checked){border-color:var(--blue);background:#EEF3FD;}
.field .forma-chip input:checked + span{font-weight:600;}
.field-error{color:var(--red);font-size:12px;font-weight:600;margin-top:6px;}

.footer-note{margin:16px 24px 0;font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}

.planos-list{max-height:280px;overflow-y:auto;margin-bottom:14px;}
.plano-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);}
.plano-row:last-child{border-bottom:none;}
.plano-row input[type="color"]{width:30px;height:30px;padding:2px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;flex-shrink:0;}
.plano-row input[type="text"]{flex:1;padding:8px 9px;border:1px solid var(--rule);border-radius:5px;font-size:13.5px;font-family:'Inter',sans-serif;}
.plano-add-row{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--rule);}
.plano-add-row input[type="color"]{width:30px;height:30px;padding:2px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;flex-shrink:0;}
.plano-add-row input[type="text"]{flex:1;padding:9px 10px;border:1px solid var(--rule);border-radius:5px;font-size:13.5px;font-family:'Inter',sans-serif;}

.comentario-line{font-size:12px;font-weight:400;color:var(--ink-soft);margin-top:5px;line-height:1.35;max-width:420px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;}
.conta-line{font-size:11.5px;color:var(--ink-soft);margin-top:3px;white-space:normal;}
.obs-pag-line{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35;max-width:240px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;}

.modal.modal-wide{max-width:580px;}
.cc-list{max-height:300px;overflow-y:auto;margin-bottom:14px;}
.cc-row,.cc-add-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cc-row{padding:8px 0;border-bottom:1px solid var(--rule);}
.cc-row:last-child{border-bottom:none;}
.cc-add-row{padding-top:12px;border-top:1px solid var(--rule);}
.cc-row input[type="text"],.cc-add-row input[type="text"]{flex:1 1 120px;min-width:0;padding:8px 9px;border:1px solid var(--rule);border-radius:5px;font-size:13.5px;font-family:'Inter',sans-serif;}

.fixa-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;margin:4px 0 0 6px;background:#EEF3FD;color:var(--blue);}
.alerta-fixas{margin:14px 24px 0;border:1px solid #E9CFA4;background:#FBEEDB;border-radius:8px;padding:10px 14px;}
.alerta-fixas .alerta-titulo{font-size:12.5px;font-weight:700;color:#7A4A0E;margin-bottom:6px;}
.alerta-fixas.vencida{border-color:#E7B4B4;background:#FBE6E6;}
.alerta-fixas.vencida .alerta-titulo{color:var(--red);}
.alerta-item{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:7px 0;border-top:1px solid rgba(0,0,0,.08);font-size:13px;}
.alerta-item:first-of-type{border-top:none;}
.alerta-item .txt{flex:1 1 260px;line-height:1.4;}
.alerta-item .btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-sm{padding:6px 11px;font-size:12px;}
.fixa-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--rule);}
.fixa-row:last-child{border-bottom:none;}
.fixa-row .info{flex:1 1 220px;min-width:0;}
.fixa-row .nome{font-weight:600;font-size:13.5px;}
.fixa-row .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.fixa-row .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.badge.fx-pendente{background:#FBEEDB;color:var(--amber);}
.badge.fx-ignorada{background:#ECEFEC;color:var(--ink-soft);}
.fixas-resumo{font-size:12.5px;color:var(--ink-soft);margin:-8px 0 12px;}
.notice{margin:14px 24px 0;background:#FBEEDB;border:1px solid #E9CFA4;color:#7A4A0E;border-radius:8px;padding:11px 14px;font-size:12.5px;line-height:1.45;}

.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy-900);padding:20px;}
.lock-card{background:#fff;border-radius:10px;padding:34px 28px;max-width:340px;width:100%;text-align:center;}
.lock-card .lock-icon{font-size:28px;margin-bottom:10px;}
.lock-card h1{font-family:'Zilla Slab',serif;font-size:20px;margin:0 0 6px;color:var(--ink);font-weight:600;}
.lock-card p{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}
.lock-card input{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:6px;font-size:14px;margin-bottom:12px;text-align:center;font-family:'Inter',sans-serif;}
.lock-card .btn{width:100%;padding:11px;font-size:14px;}
.lock-error{color:var(--red);font-size:12.5px;margin:-4px 0 12px;}

@media (max-width:760px){
  .cards{grid-template-columns:repeat(2,1fr);}
  table{font-size:12.5px;}
}
</style>

<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhlewWTqDvTYWP0sr5rmAg7swjS0w74DlSlK8swV2RLbSrUPrUkB_usivnXT7rI7BR/exec';
const ACCESS_TOKEN = 'S_diM8z8pN3mUVIlSUwsG1Voe71el-NF';
const APP_PASSWORD_HASH = '7509ca24a95e871446f3fdb1f39cfdb7b802fc6986899bb44ab63da9e5d097aa';
const LOCK_STORAGE_KEY = 'despesas-unlocked';
// Versão mínima do Apps Script (Code.gs) que este app espera. A versão 4 é a
// que também grava as despesas fixas e os avisos ignorados do mês.
const BACKEND_VERSAO_MINIMA = 4;
// Avisa de uma despesa fixa ainda não lançada quando faltarem até este número de dias pro vencimento.
const FIXAS_DIAS_ALERTA = 2;
let lastSyncPayload = null;

// Formas de pagamento. "conta" diz se a forma mexe numa conta corrente:
// 'obrigatoria' pede a conta a ser debitada, 'opcional' deixa informar,
// 'nao' dispensa (pagamento só em dinheiro não sai de conta nenhuma).
const FORMAS_PAGAMENTO = [
  { id:'dinheiro',       label:'Dinheiro',       conta:'nao' },
  { id:'pix',            label:'Pix',            conta:'obrigatoria' },
  { id:'cartao',         label:'Cartão',         conta:'opcional' },
  { id:'conta-corrente', label:'Conta corrente', conta:'obrigatoria' },
  { id:'cheque',         label:'Cheque',         conta:'obrigatoria' },
];

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isUnlocked(){
  try{ return localStorage.getItem(LOCK_STORAGE_KEY) === '1'; }catch(e){ return false; }
}
function renderLockScreen(errorMsg){
  document.getElementById('app').innerHTML = `
    <div class="lock-screen">
      <div class="lock-card">
        <div class="lock-icon">🔒</div>
        <h1>Controle de Despesas</h1>
        <p>Digite a senha para continuar</p>
        <form id="lock-form">
          <input type="password" id="lock-password" placeholder="Senha" autocomplete="current-password" required>
          ${errorMsg ? `<div class="lock-error">${errorMsg}</div>` : ''}
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
      </div>
    </div>
  `;
  const pwInput = document.getElementById('lock-password');
  pwInput.focus();
  document.getElementById('lock-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const val = pwInput.value;
    const hash = await sha256Hex(val);
    if(hash === APP_PASSWORD_HASH){
      try{ localStorage.setItem(LOCK_STORAGE_KEY, '1'); }catch(e){}
      render();
      loadData();
    } else {
      renderLockScreen('Senha incorreta. Tente de novo.');
    }
  });
}

let state = {
  contas: [],
  planos: [],
  contasCorrentes: [],
  fixasIgnoradas: [],
  fixasModalOpen: false,
  prefill: null,
  backendDesatualizado: false,
  backendSemContas: false,
  loading: true,
  selected: new Set(),
  filterPlano: 'todos',
  filterBusca: '',
  filterMes: '',
  filterDe: '',
  filterAte: '',
  filterDateField: 'vencimento',
  filterSituacao: new Set(['em-aberto','vencida','paga','vence-hoje']),
  modalOpen: false,
  modalTipo: 'conta-a-pagar',
  editId: null,
  exportOpen: false,
  pagarModalOpen: false,
  planosModalOpen: false,
  contasModalOpen: false,
  error: null,
};

const $ = sel => document.querySelector(sel);
const genId = () => Date.now()+'-'+Math.random().toString(36).slice(2,7);
// Data de hoje no fuso do aparelho. (toISOString() devolve a data em UTC: no
// Brasil, das 21h em diante, isso já seria o dia seguinte.)
const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};
const fmtMoney = n => 'R$ ' + Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = iso => { if(!iso) return '-'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; };
const planoInfo = id => state.planos.find(p=>p.id===id) || {id:id||'sem-plano', label:'Sem plano', color:'#746C5C'};
// Conta corrente de onde saiu o pagamento. Devolve null quando a despesa não tem conta informada.
const contaInfo = id => id ? (state.contasCorrentes.find(cc=>cc.id===id) || {id:id, nome:'Conta removida', detalhes:''}) : null;
const contaNome = id => { const cc = contaInfo(id); return cc ? cc.nome : ''; };

// --- Forma de pagamento -----------------------------------------------------
// Na planilha fica gravado o texto que a pessoa lê ("Dinheiro + Pix"). Aqui o
// texto vira a lista de formas marcadas, e vice-versa.
function parseFormas(str){
  const partes = String(str||'').split(/[+,;\/]/).map(normalizeStr).filter(Boolean);
  return FORMAS_PAGAMENTO.filter(f=>partes.includes(normalizeStr(f.label)) || partes.includes(f.id)).map(f=>f.id);
}
function formasLabel(ids){
  return FORMAS_PAGAMENTO.filter(f=>ids.includes(f.id)).map(f=>f.label).join(' + ');
}
// Texto da forma de pagamento de uma despesa (se alguém escreveu outra coisa direto na planilha, mostra como está).
function formaTexto(c){
  const ids = parseFormas(c.formaPagamento);
  return ids.length ? formasLabel(ids) : String(c.formaPagamento||'').trim();
}
// A conta a ser debitada depende do que foi marcado. Sem nada marcado: onde a
// forma é obrigatória o campo de conta só aparece depois da escolha; na edição
// de pagamentos antigos (sem forma gravada) a conta continua aparecendo.
function regraConta(ids, formaObrigatoria){
  if(ids.length===0) return formaObrigatoria ? 'nao' : 'opcional';
  const regras = FORMAS_PAGAMENTO.filter(f=>ids.includes(f.id)).map(f=>f.conta);
  if(regras.includes('obrigatoria')) return 'obrigatoria';
  if(regras.includes('opcional')) return 'opcional';
  return 'nao';
}
function formasMarcadas(form){
  return Array.from(form.querySelectorAll('input[name="formaPagamento"]:checked')).map(i=>i.value);
}
// Mostra/esconde o campo de conta conforme as formas marcadas (sem redesenhar a tela).
function ajustarCampoConta(form){
  const grupo = form.querySelector('[data-formas-grupo]');
  const wrap = form.querySelector('[data-conta-wrap]');
  if(!grupo || !wrap) return;
  const regra = regraConta(formasMarcadas(form), grupo.dataset.obrigatorio==='1');
  wrap.hidden = regra==='nao';
  const sel = wrap.querySelector('select');
  if(sel){
    sel.disabled = regra==='nao';
    sel.required = regra==='obrigatoria';

// --- Despesas fixas ---------------------------------------------------------
// Uma despesa marcada como "fixa" faz o fornecedor entrar na lista de fixas.
// Em cada mês, a fixa está "lançada" se existe uma despesa dele com vencimento
// naquele mês; senão está "pendente". O dia esperado do vencimento é o dia do
// último vencimento lançado. Quando faltam até FIXAS_DIAS_ALERTA dias (ou já
// passou) e ainda não foi lançada, o app avisa — e dá pra ignorar o aviso no mês.
function diasEntre(aIso, bIso){
  const [ya,ma,da] = aIso.split('-').map(Number);
  const [yb,mb,db] = bIso.split('-').map(Number);
  return Math.round((Date.UTC(yb,mb-1,db) - Date.UTC(ya,ma-1,da)) / 86400000);
}
function calcularFixas(){
  const hoje = todayStr();
  const mes = hoje.slice(0,7);
  const [ano, m] = mes.split('-').map(Number);
  const diasNoMes = new Date(ano, m, 0).getDate();
  const grupos = new Map();
  state.contas.forEach(c=>{
    if(!c.fixa) return;
    const chave = normalizeStr(c.fornecedor);
    if(!chave) return;
    if(!grupos.has(chave)) grupos.set(chave, []);
    grupos.get(chave).push(c);
  });
  const ordem = {pendente:1, ignorada:2, lancada:3};
  const lista = [];
  grupos.forEach((cs, chave)=>{
    cs.sort((a,b)=>String(b.vencimento||'').localeCompare(String(a.vencimento||'')));
    const ultima = cs[0];
    const doMes = cs.find(c=>String(c.vencimento||'').slice(0,7)===mes) || null;
    const ignorada = state.fixasIgnoradas.some(i=>i.chave===chave && i.mes===mes);
    const status = doMes ? 'lancada' : (ignorada ? 'ignorada' : 'pendente');
    const diaRef = Number(String(ultima.vencimento||'').slice(8,10)) || 1;
    const vencEsperado = mes + '-' + String(Math.min(diaRef, diasNoMes)).padStart(2,'0');
    const dias = diasEntre(hoje, vencEsperado);
    lista.push({
      chave, nome: ultima.fornecedor, plano: ultima.plano, valorUltimo: ultima.valor,
      vencEsperado, dias, status, doMes, contas: cs,
      alerta: status==='pendente' && dias <= FIXAS_DIAS_ALERTA,
    });
  });
  return lista.sort((a,b)=> (a.alerta===b.alerta ? 0 : (a.alerta ? -1 : 1))
    || ordem[a.status]-ordem[b.status]
    || a.vencEsperado.localeCompare(b.vencEsperado)
    || a.nome.localeCompare(b.nome,'pt-BR'));
}
function textoPrazoFixa(f){
  if(f.dias===0) return 'vence hoje';
  if(f.dias>0) return 'vence em ' + f.dias + ' dia' + (f.dias===1?'':'s') + ' (' + fmtDate(f.vencEsperado) + ')';
  const atraso = -f.dias;
  return 'o vencimento era ' + fmtDate(f.vencEsperado) + ' (' + atraso + ' dia' + (atraso===1?'':'s') + ' atrás)';
}

function removerDasFixas(chave){

function getFiltered(){
  const busca = state.filterBusca.toLowerCase();
  return state.contas.filter(c=>{
    if(state.filterPlano!=='todos' && c.plano!==state.filterPlano) return false;
    if(busca && ![c.fornecedor, c.comentario, c.obsPagamento, formaTexto(c)].some(t=>String(t||'').toLowerCase().includes(busca))) return false;
    const dateVal = c[state.filterDateField];
    if(state.filterMes){
      if(!dateVal || dateVal.slice(0,7)!==state.filterMes) return false;
    }
    if(state.filterDe){
      if(!dateVal || dateVal < state.filterDe) return false;
    }
    if(state.filterAte){
      if(!dateVal || dateVal > state.filterAte) return false;
    }
    const sit = getSituacao(c);
    if(!state.filterSituacao.has(sit)) return false;
    return true;
  }).sort((a,b)=>{
    const order = {'vencida':0, 'vence-hoje':1, 'em-aberto':2, 'paga':3};
    const diff = order[getSituacao(a)] - order[getSituacao(b)];
    if(diff!==0) return diff;
    return a.vencimento.localeCompare(b.vencimento);
  });
}

// --- Rascunho dos formulários abertos -------------------------------------
// A tela inteira é redesenhada a cada mudança (inclusive quando chega a
// resposta da planilha, 1–2 s depois de salvar). Sem isto, quem já estivesse
// digitando outra despesa, um comentário ou a próxima conta corrente perderia
// o que digitou. Aqui guardamos só os campos que a pessoa alterou e devolvemos
// depois do redesenho; o arquivo escolhido como anexo é movido junto.
function fieldKey(el){
  if(el.id) return '#'+el.id;
  if(el.name) return 'name:'+el.name;
  const d = el.dataset ? (el.dataset.ccId || el.dataset.planoId) : null;
  return d ? el.className+':'+d : null;
}
function captureDrafts(){
  const drafts = [];
  document.querySelectorAll('#app .modal-overlay').forEach(ov=>{
    ov.querySelectorAll('input,select,textarea').forEach(el=>{
      const key = fieldKey(el);
      if(!key) return;
      if(el.type==='file'){
        if(el.files && el.files.length) drafts.push({ov:ov.id, key, node:el});
        return;
      }
      // caixinhas de marcar (formas de pagamento): o que muda é o "marcado", não o valor
      if(el.type==='checkbox' || el.type==='radio'){
        if(el.checked!==el.defaultChecked) drafts.push({ov:ov.id, key, checked:el.checked});
        return;
      }
      const alterado = el.tagName==='SELECT'
        ? Array.from(el.options).some(o=>o.selected!==o.defaultSelected)
        : el.value!==el.defaultValue;
      if(alterado) drafts.push({ov:ov.id, key, value:el.value});
    });
  });
  return drafts;
}
function findField(ovId, key){
  const ov = ovId ? document.getElementById(ovId) : null;
  if(!ov) return null;
  return Array.from(ov.querySelectorAll('input,select,textarea')).find(x=>fieldKey(x)===key) || null;
}
function restoreDrafts(drafts){
  drafts.forEach(d=>{
    const el = findField(d.ov, d.key);
    if(!el) return; // o formulário foi fechado ou o campo não existe mais
    if(d.node){ el.replaceWith(d.node); return; }
    if('checked' in d){ el.checked = d.checked; return; }
    if(el.tagName==='SELECT' && !Array.from(el.options).some(o=>o.value===d.value)) return;
    el.value = d.value;
  });
}

      Filtrando por <b style="color:var(--ink);">${state.filterDateField==='pagamento'?'data de pagamento':'data de vencimento'}</b>
      ${state.filterMes ? ` · mês ${state.filterMes.split('-').reverse().join('/')}` : ''}
      ${state.filterDe ? ` · de ${fmtDate(state.filterDe)}` : ''}
      ${state.filterAte ? ` · até ${fmtDate(state.filterAte)}` : ''}
    </div>` : ''}

    <div class="statusbar">
      <div class="status-chips">
        <label><input type="checkbox" data-sit="vence-hoje" ${state.filterSituacao.has('vence-hoje')?'checked':''}> Vence hoje</label>
        <label><input type="checkbox" data-sit="vencida" ${state.filterSituacao.has('vencida')?'checked':''}> Vencidas</label>
        <label><input type="checkbox" data-sit="em-aberto" ${state.filterSituacao.has('em-aberto')?'checked':''}> Em aberto</label>
        <label><input type="checkbox" data-sit="paga" ${state.filterSituacao.has('paga')?'checked':''}> Pagas</label>
        <span class="desmarcar" id="desmarcar-tudo">Desmarcar tudo</span>
      </div>
      <div class="right-actions">
        <button class="btn btn-outline" id="btn-fixar" ${hasSelection?'':'disabled style="opacity:.5;cursor:not-allowed;"'}>${hasSelection && getSelectedRows().every(c=>c.fixa) ? '📌 Desmarcar como fixas' : '📌 Marcar como fixas'}</button>
        <button class="btn btn-green" id="btn-pagar" ${hasSelection?'':'disabled style="opacity:.5;cursor:not-allowed;"'}>✓ Pagar selecionadas</button>
      </div>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th style="width:34px;"><input type="checkbox" id="check-all" ${filtered.length>0 && filtered.every(c=>state.selected.has(c.id)) ? 'checked' : ''}></th>
            <th>Fornecedor</th>
            <th>Valor</th>
            <th>Vencimento</th>
            <th>Pagamento</th>
            <th>Situação</th>
            <th style="width:110px;">Ações</th>
          </tr>
        </thead>
        <tbody>
          ${state.loading ? `<tr class="empty-row"><td colspan="7">Carregando…</td></tr>` :
            filtered.length===0 ? `<tr class="empty-row"><td colspan="7"><b>Nenhuma despesa encontrada</b>Ajuste os filtros ou lance uma nova despesa acima.</td></tr>` :
            filtered.map(c=>{
              const sit = getSituacao(c);
              const plano = planoInfo(c.plano);
              return `
              <tr>
                <td><input type="checkbox" class="row-check" data-id="${c.id}" ${state.selected.has(c.id)?'checked':''}></td>
                <td class="fornecedor">${escapeHtml(c.fornecedor)}<br><span class="plano-tag" style="background:${plano.color}">${plano.label}</span>${c.fixa ? '<span class="fixa-tag">📌 Fixa</span>' : ''}${c.comentario ? `<div class="comentario-line" title="${escapeAttr(c.comentario)}">💬 ${escapeHtml(c.comentario)}</div>` : ''}</td>
                <td class="valor-cell">${fmtMoney(c.valor)}</td>
                <td class="date-cell">${fmtDate(c.vencimento)}</td>
                <td class="date-cell">${fmtDate(c.pagamento)}${c.pagamento ? pagamentoDetalhes(c) : ''}</td>
                <td><span class="badge ${sit}">${SITUACAO_LABEL[sit].toUpperCase()}</span></td>
                <td class="acoes">
                  <button class="icon-btn" data-view-anexo="${c.id}" title="${c.anexo?'Ver anexo':'Sem anexo'}" ${c.anexo?'':'disabled style="opacity:.35;cursor:not-allowed;"'}>📎</button>
                  <button class="icon-btn" data-edit="${c.id}" title="Editar">✎</button>
                  <button class="icon-btn danger" data-del="${c.id}" title="Excluir">🗑</button>
                </td>
              </tr>`;
            }).join('')
          }
        </tbody>
      </table>
    </div>

    <div class="footer-note">
      <span>${all.length} despesa${all.length===1?'':'s'} no total · ${filtered.length} exibida${filtered.length===1?'':'s'} com os filtros atuais</span>
      ${all.length>0 ? `<span class="clear" id="clear-all" style="cursor:pointer;text-decoration:underline;">Limpar tudo</span>` : ''}
    </div>
    ${state.error ? `<div style="margin:10px 24px 0;color:var(--red);font-size:12.5px;">${state.error} <span id="retry-save" style="cursor:pointer;text-decoration:underline;font-weight:600;">Tentar novamente</span></div>` : ''}

    ${state.modalOpen ? renderModal() : ''}
    ${state.pagarModalOpen ? renderPagarModal() : ''}
    ${state.planosModalOpen ? renderPlanosModal() : ''}
    ${state.contasModalOpen ? renderContasModal() : ''}
    ${state.fixasModalOpen ? renderFixasModal() : ''}
  `;

  restoreDrafts(drafts);
  bindEvents();

  if(activeId || activeKey){
    const toFocus = activeId ? document.getElementById(activeId) : findField(activeOvId, activeKey);
    if(toFocus){
      toFocus.focus();
      if(selStart!=null && typeof toFocus.setSelectionRange === 'function'){
        try{ toFocus.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function renderPagarModal(){
  const rows = getSelectedRows();
  const total = rows.reduce((s,c)=>s+c.valor,0);
  // com uma despesa só, traz o que já estiver gravado nela (caso de corrigir um pagamento)
  const unica = rows.length===1 ? rows[0] : null;
  return `
    <div class="modal-overlay" id="pagar-overlay">
      <div class="modal">
        <h2>Confirmar pagamento</h2>
        <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 14px;">
          ${rows.length} despesa${rows.length===1?'':'s'} selecionada${rows.length===1?'':'s'} · total ${fmtMoney(total)}
        </p>
        <form id="pagar-form">
          <div class="field"><label>Data de pagamento</label><input type="date" name="dataPagamento" value="${todayStr()}" required></div>
          ${formaPagamentoField('pagar', unica ? parseFormas(unica.formaPagamento) : [], true)}
          ${contaSelectField('contaPagamento', 'Conta a ser debitada', unica ? (unica.contaPagamento||'') : '', true)}
          <div class="field"><label>Observação do pagamento (opcional)</label><textarea name="obsPagamento" rows="2" maxlength="500" placeholder="Ex.: R$ 500,00 em dinheiro e o restante no Pix">${unica ? escapeHtml(unica.obsPagamento||'') : ''}</textarea>
            ${rows.length>1 ? `<div class="hint">A forma de pagamento e a observação valem para as ${rows.length} despesas selecionadas.</div>` : ''}
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" id="pagar-cancel">Cancelar</button>
            <button type="submit" class="btn btn-green">Confirmar pagamento</button>

// Campo "forma de pagamento": caixinhas, pra poder marcar mais de uma
// (Dinheiro + Cartão, Dinheiro + Pix, Dinheiro + Conta corrente...).
function formaPagamentoField(prefixo, selecionadas, obrigatorio){
  return `
    <div class="field" data-formas-grupo data-obrigatorio="${obrigatorio?'1':''}">
      <label>Forma de pagamento${obrigatorio?'':' (opcional)'}</label>
      <div class="formas-chips">
        ${FORMAS_PAGAMENTO.map(f=>`<label class="forma-chip"><input type="checkbox" id="${prefixo}-forma-${f.id}" name="formaPagamento" value="${f.id}" ${selecionadas.includes(f.id)?'checked':''}><span>${f.label}</span></label>`).join('')}
      </div>
      <div class="hint">Pagou de mais de um jeito? Marque todas as formas usadas (ex.: Dinheiro + Pix).</div>
      <div class="field-error" data-formas-erro hidden>Marque pelo menos uma forma de pagamento.</div>
    </div>`;
}

// Campo "de qual conta corrente sai o pagamento". Quando ainda não existe
// nenhuma conta cadastrada, mostra o atalho pro cadastro em vez de uma lista vazia.
// Se o formulário também tem a forma de pagamento, é ela que decide se este
// campo aparece e se é obrigatório (veja ajustarCampoConta).
function contaSelectField(name, label, selectedId, obrigatorio){
  const contas = state.contasCorrentes;
  if(contas.length===0){
    return `
      <div class="field" data-conta-wrap><label>${label}</label>
        <div class="hint" style="margin-top:0;">Nenhuma conta corrente cadastrada ainda. <span class="link" data-abrir-contas>Cadastrar contas correntes</span></div>
      </div>`;
  }
  // se a despesa aponta pra uma conta que já foi excluída, mantém a opção pra não trocar sem querer
  const orfa = selectedId && !contas.some(cc=>cc.id===selectedId);
  return `
    <div class="field" data-conta-wrap><label>${label}</label>
      <select name="${name}" ${obrigatorio?'required':''}>
        <option value="">${obrigatorio ? 'Selecione a conta…' : 'Não informada'}</option>
        ${orfa ? `<option value="${escapeAttr(selectedId)}" selected>Conta removida</option>` : ''}
        ${contas.map(cc=>`<option value="${escapeAttr(cc.id)}" ${selectedId===cc.id?'selected':''}>${escapeHtml(cc.nome)}${cc.detalhes?' — '+escapeHtml(cc.detalhes):''}</option>`).join('')}
      </select>
    </div>`;
}

function renderFixasModal(){
  const lista = calcularFixas();
  const mes = todayStr().slice(0,7).split('-').reverse().join('/');
  const lancadas = lista.filter(f=>f.status==='lancada').length;
  return `
    <div class="modal-overlay" id="fixas-overlay">
      <div class="modal modal-wide">
        <h2>Despesas fixas · ${mes}</h2>
        ${lista.length ? `<p class="fixas-resumo"><b>${lancadas}</b> de <b>${lista.length}</b> já lançada${lancadas===1?'':'s'} neste mês.</p>` : ''}
        <div class="planos-list" style="max-height:400px;">
          ${lista.length===0 ? `<p style="font-size:13px;color:var(--ink-soft);line-height:1.5;">Nenhuma despesa fixa ainda. Ao lançar ou editar uma despesa, marque <b>Despesa fixa (todo mês)</b> — ou selecione despesas já lançadas na tela principal e clique em <b>Marcar como fixas</b>.</p>` : lista.map(f=>{
            const plano = planoInfo(f.plano);
            const rotulo = {lancada:'LANÇADA', pendente:'PENDENTE', ignorada:'IGNORADA'}[f.status];
            const cls = {lancada:'paga', pendente:'fx-pendente', ignorada:'fx-ignorada'}[f.status];
            let meta;
            if(f.status==='lancada') meta = 'Vencimento ' + fmtDate(f.doMes.vencimento) + ' · ' + fmtMoney(f.doMes.valor);
            else if(f.status==='ignorada') meta = 'Ignorada neste mês · costuma vencer dia ' + f.vencEsperado.slice(8,10);
            else meta = 'Costuma vencer dia ' + f.vencEsperado.slice(8,10) + ' · último valor ' + fmtMoney(f.valorUltimo) + (f.alerta ? ' · <b style="color:var(--red);">' + textoPrazoFixa(f) + '</b>' : '');
            return `
            <div class="fixa-row">
              <div class="info">
                <div class="nome">${escapeHtml(f.nome)} <span class="plano-tag" style="display:inline-block;font-size:10.5px;font-weight:400;padding:2px 8px;border-radius:20px;color:#fff;background:${plano.color};margin-left:4px;">${plano.label}</span></div>
                <div class="meta">${meta}</div>
              </div>
              <div class="btns">
                <span class="badge ${cls}">${rotulo}</span>
                ${f.status==='pendente' ? `<button type="button" class="btn btn-primary btn-sm" data-fixa-lancar="${escapeAttr(f.chave)}">Lançar</button><button type="button" class="btn btn-outline btn-sm" data-fixa-ignorar="${escapeAttr(f.chave)}">Ignorar este mês</button>` : ''}
                ${f.status==='ignorada' ? `<button type="button" class="btn btn-outline btn-sm" data-fixa-desfazer="${escapeAttr(f.chave)}">Desfazer</button><button type="button" class="btn btn-primary btn-sm" data-fixa-lancar="${escapeAttr(f.chave)}">Lançar</button>` : ''}
                <button type="button" class="icon-btn danger" data-fixa-remover="${escapeAttr(f.chave)}" title="Tirar das despesas fixas">✕</button>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="fixas-close">Fechar</button>
        </div>
      </div>
    </div>
  `;
}

// Fornecedores já lançados: viram sugestões na hora de digitar. Não existe
// cadastro separado — a lista sai das próprias despesas (sem repetir nomes que
// só mudam em maiúsculas/acentos) e guarda o plano usado no lançamento mais recente.
function fornecedoresSugeridos(){
  const mapa = new Map();
  state.contas.slice()
    .sort((a,b)=>String(b.vencimento||'').localeCompare(String(a.vencimento||'')))
    .forEach(c=>{
      const nome = String(c.fornecedor||'').trim();
      const chave = normalizeStr(nome);
      if(chave && !mapa.has(chave)) mapa.set(chave, { nome, plano: c.plano });
    });
  return Array.from(mapa.values()).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}

function renderModal(){
  const editing = state.editId ? state.contas.find(c=>c.id===state.editId) : null;
  const tipo = editing ? editing.tipo : state.modalTipo;
  const pago = !!(editing && editing.pagamento);
  // vindo de "Lançar" nas despesas fixas: já traz fornecedor, plano, valor e vencimento esperado
  const pre = (!editing && state.prefill) ? state.prefill : null;
  const fixaMarcada = editing ? !!editing.fixa : !!pre;
  return `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <h2>${editing? 'Editar despesa' : 'Nova despesa'}</h2>
        ${!editing ? `
        <div class="tipo-toggle">
          <button type="button" data-tipo="conta-a-pagar" class="${tipo==='conta-a-pagar'?'active':''}">Conta a pagar</button>
          <button type="button" data-tipo="avulso" class="${tipo==='avulso'?'active':''}">Lançamento avulso</button>
        </div>` : ''}
        <form id="conta-form">
          <div class="field"><label>Fornecedor / descrição</label><input type="text" name="fornecedor" list="fornecedores-list" autocomplete="off" value="${editing? escapeAttr(editing.fornecedor):(pre?escapeAttr(pre.fornecedor):'')}" required>
            <datalist id="fornecedores-list">${fornecedoresSugeridos().map(f=>`<option value="${escapeAttr(f.nome)}"></option>`).join('')}</datalist></div>
          <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" min="0.01" name="valor" value="${editing? editing.valor:(pre?pre.valor:'')}" required></div>
          <div class="field"><label>Plano de contas</label>
            <select name="plano">${state.planos.map(p=>`<option value="${p.id}" ${(editing&&editing.plano===p.id)||(pre&&pre.plano===p.id)?'selected':''}>${p.label}</option>`).join('')}</select>
          </div>
          ${tipo==='conta-a-pagar' ? `
          <div class="field"><label>Vencimento</label><input type="date" name="vencimento" value="${editing? editing.vencimento:(pre?pre.vencimento:'')}" required></div>
          ` : `
          <div class="field"><label>Data</label><input type="date" name="vencimento" value="${editing? editing.vencimento: todayStr()}" required></div>
          `}
          ${(!editing && tipo==='avulso') ? formaPagamentoField('desp', [], true) + contaSelectField('contaPagamento', 'Conta debitada', '', true) : ''}
          ${pago ? formaPagamentoField('desp', parseFormas(editing.formaPagamento), false) + contaSelectField('contaPagamento', 'Conta debitada no pagamento', editing.contaPagamento||'', false) : ''}
          ${pago ? `<div class="field"><label>Observação do pagamento (opcional)</label><textarea name="obsPagamento" rows="2" maxlength="500" placeholder="Observação sobre o pagamento">${escapeHtml(editing.obsPagamento||'')}</textarea></div>` : ''}
          <div class="field"><label class="forma-chip"><input type="checkbox" id="desp-fixa" name="fixa" value="1" ${fixaMarcada?'checked':''}><span>📌 Despesa fixa (todo mês)</span></label>
            <div class="hint">Despesas fixas aparecem em "Despesas fixas" e o app avisa quando ainda não foram lançadas perto do vencimento.</div></div>
          <div class="field"><label>Comentário (opcional)</label><textarea name="comentario" rows="2" maxlength="500" placeholder="Observação sobre esta despesa">${editing ? escapeHtml(editing.comentario||'') : ''}</textarea></div>
          <div class="field">
            <label>Anexo (nota fiscal, boleto...)</label>
            ${editing && editing.anexo ? `<div style="margin-bottom:6px;font-size:12.5px;"><a href="${editing.anexo}" target="_blank" rel="noopener">📎 Ver anexo atual</a> — escolha outro arquivo abaixo pra substituir</div>` : ''}
            <input type="file" name="anexo" accept=".pdf,image/*">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" id="modal-cancel">Cancelar</button>
            <button type="submit" class="btn btn-primary">${editing?'Salvar':'Lançar'}</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function bindEvents(){
  const app = $('#app');

  app.querySelector('#btn-lock').addEventListener('click', ()=>{
    if(confirm('Bloquear o app? Vai ser preciso digitar a senha de novo para acessar.')){
      try{ localStorage.removeItem(LOCK_STORAGE_KEY); }catch(e){}
      location.reload();
    }
  });

  app.querySelector('#btn-fixas').addEventListener('click', ()=>{
    state.fixasModalOpen = true; state.exportOpen=false; render();
  });
  app.querySelectorAll('[data-fixa-lancar]').forEach(b=>b.addEventListener('click', ()=>lancarFixa(b.dataset.fixaLancar)));
  app.querySelectorAll('[data-fixa-ignorar]').forEach(b=>b.addEventListener('click', ()=>ignorarFixaNoMes(b.dataset.fixaIgnorar)));
  app.querySelectorAll('[data-fixa-desfazer]').forEach(b=>b.addEventListener('click', ()=>desfazerIgnorarFixa(b.dataset.fixaDesfazer)));
  app.querySelectorAll('[data-fixa-remover]').forEach(b=>b.addEventListener('click', ()=>removerDasFixas(b.dataset.fixaRemover)));
  const fixasOverlay = app.querySelector('#fixas-overlay');
  if(fixasOverlay){
    fixasOverlay.addEventListener('click', e=>{ if(e.target===fixasOverlay){ state.fixasModalOpen=false; render(); } });
    app.querySelector('#fixas-close').addEventListener('click', ()=>{ state.fixasModalOpen=false; render(); });
  }
  const fixarBtn = app.querySelector('#btn-fixar');
  if(fixarBtn && state.selected.size>0){
    fixarBtn.addEventListener('click', ()=>{
      const rows = getSelectedRows();
      const marcar = !rows.every(c=>c.fixa);
      const ids = new Set(rows.map(c=>c.id));
      const changed = [];
      state.contas = state.contas.map(c=>{
        if(!ids.has(c.id)) return c;
        const u = {...c, fixa: marcar}; changed.push(u); return u;
      });
      state.selected.clear();
      render();
      syncChange(changed, []);
    });
  }

  app.querySelector('#btn-planos').addEventListener('click', ()=>{
    state.planosModalOpen = true; state.exportOpen=false; render();
  });

  app.querySelector('#btn-contas').addEventListener('click', ()=>{
    state.contasModalOpen = true; state.exportOpen=false; render();
  });
  // atalho "Cadastrar contas correntes" que aparece nos formulários quando ainda não há nenhuma conta
  app.querySelectorAll('[data-abrir-contas]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.modalOpen = false; state.editId = null; state.pagarModalOpen = false;
      state.contasModalOpen = true;
      render();
    });
  });

  // formulários com forma de pagamento: o campo da conta acompanha o que estiver marcado
  app.querySelectorAll('form').forEach(form=>{
    if(!form.querySelector('[data-formas-grupo]')) return;
    ajustarCampoConta(form);
    form.querySelectorAll('input[name="formaPagamento"]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        ajustarCampoConta(form);
        const erro = form.querySelector('[data-formas-erro]');
        if(erro && formasMarcadas(form).length>0) erro.hidden = true;
      });
    });
  });

  app.querySelector('#btn-nova').addEventListener('click', ()=>{
    state.prefill = null;
    state.modalOpen = true; state.modalTipo='conta-a-pagar'; state.editId=null; state.exportOpen=false; render();
  });

  app.querySelectorAll('.icon-btn[data-view-anexo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = state.contas.find(x=>x.id===btn.dataset.viewAnexo);
      if(c && c.anexo) window.open(c.anexo, '_blank', 'noopener');
    });
  });

  app.querySelectorAll('.icon-btn[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.editId = btn.dataset.edit; state.modalOpen = true; render(); });
  });
  app.querySelectorAll('.icon-btn[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Excluir esta despesa?')){
        const id = btn.dataset.del;
        state.contas = state.contas.filter(c=>c.id!==id);
        state.selected.delete(id);
        render();
        syncChange([], [id]);
      }
    });
  });

  app.querySelector('#f-plano').addEventListener('change', e=>{ state.filterPlano=e.target.value; render(); });
  app.querySelector('#f-busca').addEventListener('input', e=>{ state.filterBusca=e.target.value; render(); });
  app.querySelector('#f-datefield').addEventListener('change', e=>{ state.filterDateField=e.target.value; render(); });
  app.querySelector('#f-mes').addEventListener('change', e=>{ state.filterMes=e.target.value; render(); });
  app.querySelector('#f-de').addEventListener('change', e=>{ state.filterDe=e.target.value; render(); });
  app.querySelector('#f-ate').addEventListener('change', e=>{ state.filterAte=e.target.value; render(); });
  app.querySelector('#f-clear').addEventListener('click', ()=>{
    state.filterPlano='todos'; state.filterBusca=''; state.filterMes=''; state.filterDe=''; state.filterAte=''; state.filterDateField='vencimento';
    render();
  });

  app.querySelectorAll('.status-chips input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) state.filterSituacao.add(cb.dataset.sit);
      else state.filterSituacao.delete(cb.dataset.sit);
      render();
    });
  });
  app.querySelector('#desmarcar-tudo').addEventListener('click', ()=>{
    state.filterSituacao = new Set();
    render();
  });

  app.querySelector('#check-all').addEventListener('change', e=>{
    const filtered = getFiltered();
    if(e.target.checked) filtered.forEach(c=>state.selected.add(c.id));
    else filtered.forEach(c=>state.selected.delete(c.id));
    render();
  });
  app.querySelectorAll('.row-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) state.selected.add(cb.dataset.id);
      else state.selected.delete(cb.dataset.id);
      render();
    });
  });

  const pagarBtn = app.querySelector('#btn-pagar');
  if(pagarBtn && state.selected.size>0){
    pagarBtn.addEventListener('click', ()=>{
      state.pagarModalOpen = true;
      render();
    });
  }

  const pagarOverlay = app.querySelector('#pagar-overlay');
  if(pagarOverlay){
    pagarOverlay.addEventListener('click', e=>{ if(e.target===pagarOverlay){ state.pagarModalOpen=false; render(); } });
    app.querySelector('#pagar-cancel').addEventListener('click', ()=>{ state.pagarModalOpen=false; render(); });
    app.querySelector('#pagar-form').addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const dataPagamento = fd.get('dataPagamento');
      if(!dataPagamento) return;
      const pag = lerFormaEConta(e.target, fd);
      if(!pag) return; // faltou marcar a forma de pagamento
      const formaPagamento = formasLabel(pag.formas);
      const obsPagamento = String(fd.get('obsPagamento')||'').trim();
      const changed = [];
      state.contas = state.contas.map(c=>{
        if(state.selected.has(c.id)){
          const updated = {...c, pagamento: dataPagamento, formaPagamento, obsPagamento};
          // null = não há contas correntes cadastradas, então não mexe na conta
          if(pag.contaPagamento!==null) updated.contaPagamento = pag.contaPagamento;
          changed.push(updated);
          return updated;
        }
        return c;
      });
      state.selected.clear();
      state.pagarModalOpen = false;
      render();
      syncChange(changed, []);
    });
  }

  app.querySelector('#btn-import').addEventListener('click', ()=>{
    app.querySelector('#import-file').click();
  });
  app.querySelector('#import-file').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{ importFromCsvText(ev.target.result); };
    reader.readAsText(file, 'UTF-8');
  });

  app.querySelector('#btn-export').addEventListener('click', (e)=>{
    e.stopPropagation();
    state.exportOpen = !state.exportOpen;
    render();
  });
  const menu = app.querySelector('#export-menu');
  if(menu){
    menu.addEventListener('click', e=> e.stopPropagation());
    menu.querySelectorAll('[data-exp]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const action = btn.dataset.exp;
        if(action==='pdf-geral') exportPdf(getFiltered(), 'Despesas gerais');
        if(action==='pdf-sel') exportPdf(getSelectedRows(), 'Despesas selecionadas');
        if(action==='xls-geral') exportXls(getFiltered(), 'despesas-gerais.xlsx');
        if(action==='xls-sel') exportXls(getSelectedRows(), 'despesas-selecionadas.xlsx');
        if(action==='csv-geral') exportCsv(getFiltered(), 'despesas-gerais.csv');
        state.exportOpen = false;
        render();
      });
    });
    document.addEventListener('click', function closeMenu(){
      state.exportOpen = false; render();
      document.removeEventListener('click', closeMenu);
    }, {once:true});
  }

  const retryBtn = app.querySelector('#retry-save');
  if(retryBtn){
    retryBtn.addEventListener('click', ()=>{
      if(lastSyncPayload) syncChange(lastSyncPayload.contas, lastSyncPayload.deletedIds);
      else loadData();
    });
  }

  const clearAll = app.querySelector('#clear-all');
  if(clearAll){
    clearAll.addEventListener('click', ()=>{
      if(confirm('Excluir todas as despesas? Essa ação não pode ser desfeita.')){
        const ids = state.contas.map(c=>c.id);
        state.contas = []; state.selected.clear();
        render();
        syncChange([], ids);
      }
    });
  }

  const contasOverlay = app.querySelector('#contas-overlay');
  if(contasOverlay){
    contasOverlay.addEventListener('click', e=>{ if(e.target===contasOverlay){ state.contasModalOpen=false; render(); } });
    app.querySelector('#contas-close').addEventListener('click', ()=>{ state.contasModalOpen=false; render(); });

    // salva ao confirmar (Enter) ou ao sair do campo; se nada mudou, não faz nada
    app.querySelectorAll('.cc-nome-input').forEach(input=>{
      const salvar = ()=>{
        const cc = state.contasCorrentes.find(x=>x.id===input.dataset.ccId);
        if(!cc) return;
        const novoNome = input.value.trim();
        if(!novoNome){ input.value = cc.nome; return; } // conta não pode ficar sem nome
        if(cc.nome===novoNome) return;
        cc.nome = novoNome;
        syncContasCorrentes([cc], []);
      };
      input.addEventListener('change', salvar);
      input.addEventListener('blur', salvar);
    });
    app.querySelectorAll('.cc-detalhes-input').forEach(input=>{
      const salvar = ()=>{
        const cc = state.contasCorrentes.find(x=>x.id===input.dataset.ccId);
        if(!cc) return;
        const novo = input.value.trim();
        if((cc.detalhes||'')===novo) return;
        cc.detalhes = novo;
        syncContasCorrentes([cc], []);
      };
      input.addEventListener('change', salvar);
      input.addEventListener('blur', salvar);
    });

    app.querySelectorAll('[data-cc-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.ccDel;
        const emUso = state.contas.filter(c=>c.contaPagamento===id).length;
        if(emUso>0){
          alert(`Essa conta foi usada em ${emUso} pagamento(s). Troque a conta desses pagamentos (editando as despesas) antes de excluí-la.`);
          return;
        }
        if(!confirm('Excluir esta conta corrente?')) return;
        state.contasCorrentes = state.contasCorrentes.filter(cc=>cc.id!==id);
        render();
        syncContasCorrentes([], [id]);
      });
    });

    const addConta = ()=>{
      const nomeInput = app.querySelector('#nova-cc-nome');
      const detalhesInput = app.querySelector('#nova-cc-detalhes');
      const nome = nomeInput.value.trim();
      if(!nome){ nomeInput.focus(); return; }
      if(state.contasCorrentes.some(cc=>normalizeStr(cc.nome)===normalizeStr(nome))){
        alert('Já existe uma conta corrente com esse nome.');
        nomeInput.focus();
        return;
      }
      const nova = { id: genId(), nome, detalhes: detalhesInput.value.trim() };
      state.contasCorrentes.push(nova);
      nomeInput.value = ''; detalhesInput.value = '';
      render();
      const proximo = document.getElementById('nova-cc-nome');
      if(proximo) proximo.focus();
      syncContasCorrentes([nova], []);
    };
    app.querySelector('#btn-add-cc').addEventListener('click', addConta);
    ['#nova-cc-nome','#nova-cc-detalhes'].forEach(sel=>{
      app.querySelector(sel).addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addConta(); } });
    });
  }

  const planosOverlay = app.querySelector('#planos-overlay');
  if(planosOverlay){
    planosOverlay.addEventListener('click', e=>{ if(e.target===planosOverlay){ state.planosModalOpen=false; render(); } });
    app.querySelector('#planos-close').addEventListener('click', ()=>{ state.planosModalOpen=false; render(); });

    app.querySelectorAll('.plano-label-input').forEach(input=>{
      input.addEventListener('change', ()=>{
        const id = input.dataset.planoId;
        const novoLabel = input.value.trim();
        if(!novoLabel) return;
        const plano = state.planos.find(p=>p.id===id);
        if(!plano || plano.label===novoLabel) return;
        plano.label = novoLabel;
        syncPlanos([plano], []);
      });
    });

    app.querySelectorAll('.plano-color-input').forEach(input=>{
      input.addEventListener('change', ()=>{
        const id = input.dataset.planoId;
        const plano = state.planos.find(p=>p.id===id);
        if(!plano) return;
        plano.color = input.value;
        render();
        syncPlanos([plano], []);
      });
    });

    app.querySelectorAll('[data-plano-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.planoDel;
        const emUso = state.contas.filter(c=>c.plano===id).length;
        if(emUso>0){
          alert(`Esse plano tem ${emUso} despesa(s) vinculada(s). Mude o plano dessas despesas (ou exclua-as) antes de remover este plano de contas.`);
          return;
        }
        if(!confirm('Excluir este plano de contas?')) return;
        state.planos = state.planos.filter(p=>p.id!==id);
        if(state.filterPlano===id) state.filterPlano='todos';
        render();
        syncPlanos([], [id]);
      });
    });

    app.querySelector('#btn-add-plano').addEventListener('click', ()=>{
      const labelInput = app.querySelector('#novo-plano-label');
      const colorInput = app.querySelector('#novo-plano-color');
      const label = labelInput.value.trim();
      if(!label) { labelInput.focus(); return; }
      const novo = { id: genId(), label, color: colorInput.value };
      state.planos.push(novo);
      labelInput.value = '';
      render();
      syncPlanos([novo], []);
    });
  }

  const overlay = app.querySelector('#modal-overlay');
  if(overlay){
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
    app.querySelector('#modal-cancel').addEventListener('click', closeModal);
    app.querySelectorAll('.tipo-toggle button').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.modalTipo = btn.dataset.tipo; render(); });
    });
    // Fornecedor já conhecido: sugere o plano de contas usado da última vez
    // (só em despesa nova, e só se a pessoa ainda não escolheu o plano na mão).
    const campoFornecedor = app.querySelector('#conta-form [name="fornecedor"]');
    const campoPlano = app.querySelector('#conta-form [name="plano"]');
    if(campoFornecedor && campoPlano){
      campoPlano.addEventListener('change', ()=>{ campoPlano.dataset.manual = '1'; });
      campoFornecedor.addEventListener('input', ()=>{
        if(state.editId || campoPlano.dataset.manual==='1') return;
        const conhecido = fornecedoresSugeridos().find(f=>normalizeStr(f.nome)===normalizeStr(campoFornecedor.value));
        if(conhecido && Array.from(campoPlano.options).some(o=>o.value===conhecido.plano)) campoPlano.value = conhecido.plano;
      });
    }
    app.querySelector('#conta-form').addEventListener('submit', async e=>{
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const valor = parseFloat(fd.get('valor'));
      if(!valor || valor<=0) return;

      // forma de pagamento e conta só aparecem em lançamento avulso (já nasce pago) ou ao editar uma despesa paga
      const pag = lerFormaEConta(form, fd);
      if(!pag) return; // faltou marcar a forma de pagamento

      const anexoFile = fd.get('anexo');
      let anexoBase64 = null;
      if(anexoFile && anexoFile.size>0){
        if(anexoFile.size > 8*1024*1024){
          alert('O arquivo é muito grande (máximo 8MB). Escolha um arquivo menor.');
          return;
        }
        anexoBase64 = await fileToBase64(anexoFile);
      }

      const comentario = String(fd.get('comentario')||'').trim();
      const contaPagamento = pag.contaPagamento;

      let changedItem;
      if(state.editId){
        state.contas = state.contas.map(c=> {
          if(c.id===state.editId){
            changedItem = {
              ...c,
              fornecedor: fd.get('fornecedor').trim(),
              valor, plano: fd.get('plano'),
              vencimento: fd.get('vencimento'),
              comentario,
              fixa: fd.has('fixa'),
            };
            if(contaPagamento!==null) changedItem.contaPagamento = contaPagamento;
            if(pag.temForma){
              // se a planilha tinha um texto que o app não reconhece e nada foi marcado, deixa como estava
              const reconhecia = parseFormas(c.formaPagamento).length>0;
              if(pag.formas.length>0 || reconhecia || !c.formaPagamento) changedItem.formaPagamento = formasLabel(pag.formas);
            }
            if(fd.has('obsPagamento')) changedItem.obsPagamento = String(fd.get('obsPagamento')||'').trim();
            if(anexoBase64){
              changedItem.anexoBase64 = anexoBase64;
              changedItem.anexoNome = anexoFile.name;
              changedItem.anexoMimeType = anexoFile.type;
            }
            return changedItem;
          }
          return c;
        });
      } else {
        const isAvulso = state.modalTipo==='avulso';
        changedItem = {
          id: genId(),
          fornecedor: fd.get('fornecedor').trim(),
          valor, plano: fd.get('plano'),
          tipo: state.modalTipo,
          vencimento: fd.get('vencimento'),
          pagamento: isAvulso ? fd.get('vencimento') : null,
          comentario,
          fixa: fd.has('fixa'),
          contaPagamento: (isAvulso && contaPagamento) ? contaPagamento : '',
          formaPagamento: isAvulso ? formasLabel(pag.formas) : '',
          obsPagamento: '',
        };
        if(anexoBase64){
          changedItem.anexoBase64 = anexoBase64;
          changedItem.anexoNome = anexoFile.name;
          changedItem.anexoMimeType = anexoFile.type;
        }
        state.contas.unshift(changedItem);
      }
      closeModal();
      syncChange([changedItem], []);
    });
  }
}

function closeModal(){ state.modalOpen=false; state.editId=null; state.prefill=null; render(); }

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function exportCsv(rows, filename){
  // as colunas novas entram no fim, pra quem já usa o arquivo exportado não ter as colunas trocadas de lugar
  const header = ['Fornecedor','Valor','Plano de contas','Vencimento','Pagamento','Situacao','Anexo','Comentario','Conta de debito','Forma de pagamento','Observacao do pagamento'];
  // um ";" ou uma quebra de linha dentro do texto quebraria as colunas do CSV
  const limpo = txt => String(txt||'').replace(/;/g,',').replace(/\s*[\r\n]+\s*/g,' ');
  const lines = [header.join(';')];
  rows.forEach(c=>{
    lines.push([
      c.fornecedor.replace(/;/g,','), c.valor.toFixed(2).replace('.',','),
      planoInfo(c.plano).label, fmtDate(c.vencimento), fmtDate(c.pagamento),
      SITUACAO_LABEL[getSituacao(c)], c.anexo || '',
      limpo(c.comentario), limpo(contaNome(c.contaPagamento)),
      limpo(formaTexto(c)), limpo(c.obsPagamento)
    ].join(';'));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename || 'despesas.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function exportXls(rows, filename){
  const data = rows.map(c=>({
    'Fornecedor': c.fornecedor,
    'Plano de contas': planoInfo(c.plano).label,
    'Valor': c.valor,
    'Vencimento': fmtDate(c.vencimento),
    'Pagamento': fmtDate(c.pagamento),
    'Forma de pagamento': formaTexto(c),
    'Conta de débito': contaNome(c.contaPagamento),
    'Situação': SITUACAO_LABEL[getSituacao(c)],
    'Comentário': c.comentario || '',
    'Observação do pagamento': c.obsPagamento || '',
    'Anexo': c.anexo || ''
  }));
  const total = rows.reduce((s,c)=>s+c.valor,0);
  data.push({'Fornecedor':'', 'Plano de contas':'', 'Valor': total, 'Vencimento':'', 'Pagamento':'', 'Forma de pagamento':'', 'Conta de débito':'', 'Situação':'TOTAL', 'Comentário':'', 'Observação do pagamento':'', 'Anexo':''});
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Despesas');
  XLSX.writeFile(wb, filename || 'despesas.xlsx');
}

function exportPdf(rows, title){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 14; // margem lateral
  const planosPresentes = [...new Set(rows.map(c=>c.plano))].map(id=>planoInfo(id).label);
  const planoTitulo = planosPresentes.length===1 ? planosPresentes[0]
    : (planosPresentes.length>1 ? planosPresentes.join(' + ') : 'Nenhum plano de contas');
  const total = rows.reduce((s,c)=>s+c.valor,0);

  // Faixa de cabeçalho: nome do plano de contas em destaque
  doc.setFillColor(238,242,248);
  doc.rect(0, 0, W, 38, 'F');
  doc.setFillColor(160,180,215);
  doc.rect(0, 38, W, 0.8, 'F');
  doc.setTextColor(110,122,138);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.text(title.toUpperCase(), M, 11);
  doc.setTextColor(40,62,100);
  doc.setFont('helvetica','bold');
  let tam = 24;
  doc.setFontSize(tam);
  // nomes longos (vários planos) diminuem pra caber em uma linha
  while(doc.getTextWidth(planoTitulo) > W - 2*M && tam > 12){ tam -= 1; doc.setFontSize(tam); }
  doc.text(planoTitulo, M, 25);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(110,122,138);
  doc.text('Gerado em ' + fmtDate(todayStr()), M, 33);

  // Resumo: quantidade e total
  doc.setTextColor(22,35,58);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.text(rows.length + ' despesa' + (rows.length===1?'':'s'), M, 49);
  doc.setFont('helvetica','bold');
  doc.setFontSize(12);
  doc.text('Total: ' + fmtMoney(total), W - M, 49, { align:'right' });

  // o comentário e a observação do pagamento vão na mesma célula do fornecedor (linhas de baixo),
  // e a forma de pagamento divide a coluna com a conta, pra tabela continuar cabendo na página
  const body = rows.map(c=>[
    c.fornecedor + (c.comentario ? '\nObs.: ' + c.comentario : '') + (c.obsPagamento ? '\nObs. pagamento: ' + c.obsPagamento : ''),
    planoInfo(c.plano).label, fmtMoney(c.valor),
    fmtDate(c.vencimento), fmtDate(c.pagamento),
    SITUACAO_LABEL[getSituacao(c)]
  ]);
  doc.autoTable({
    startY: 54,
    margin: { left:M, right:M, bottom:18 },
    head: [['Fornecedor','Plano de contas','Valor','Vencimento','Pagamento','Situação']],
    body,
    styles:{ fontSize:8.5, cellPadding:2.6, textColor:[22,35,58], lineColor:[221,227,222], lineWidth:0.1 },
    headStyles:{ fillColor:[226,232,242], textColor:[40,62,100], fontStyle:'bold' },
    alternateRowStyles:{ fillColor:[248,249,251] },
    columnStyles:{ 2:{ cellWidth:28, halign:'right', fontStyle:'bold' }, 3:{ cellWidth:24 }, 4:{ cellWidth:24 }, 5:{ cellWidth:24 } },
  });

  // Área de assinatura (vai pra uma página nova se não couber embaixo da tabela)
  let y = (doc.lastAutoTable.finalY || 54) + 24;
  if(y + 30 > H - 18){ doc.addPage(); y = 40; }
  doc.setDrawColor(90,100,112);
  doc.setLineWidth(0.3);
  const larg = (W - 2*M - 16) / 2;
  doc.line(M, y, M + larg, y);
  doc.setTextColor(90,100,112);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text('Assinatura do responsável', M, y + 5);
  doc.setFontSize(10);
  doc.text('Data:  ____ / ____ / ________', M + larg + 16, y);

  // Rodapé com número de página
  const paginas = doc.getNumberOfPages();
  for(let i=1;i<=paginas;i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(140,150,160);
    doc.text('Controle de Despesas', M, H - 8);
    doc.text('Página ' + i + ' de ' + paginas, W - M, H - 8, { align:'right' });
  }
  doc.save((title==='Despesas selecionadas' ? 'despesas-selecionadas.pdf' : 'despesas-gerais.pdf'));
}

function normalizeStr(str){
  return String(str||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
}
function parseValorBR(str){
  if(!str) return null;
  const n = String(str).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',', '.');
  const v = parseFloat(n);
  return isNaN(v) ? null : v;
}
function parseDateBR(str){
  if(!str || !String(str).trim()) return null;
  const parts = String(str).trim().split('/');
  if(parts.length!==3) return null;
  const [d,m,y] = parts;
  return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function planoFromControle(str){
  const n = normalizeStr(str);
  if(!n) return state.planos[0] ? state.planos[0].id : '';
  const exato = state.planos.find(p=> normalizeStr(p.label)===n);
  if(exato) return exato.id;
  const parcial = state.planos.find(p=> n.includes(normalizeStr(p.label)) || normalizeStr(p.label).includes(n));
  if(parcial) return parcial.id;
  // fallback: mantém compatibilidade com nomes antigos usados antes de existir gerenciamento de planos
  if(n.includes('alvorada')) return 'alvorada';
  if(n.includes('boa esperanca') || n.includes('santa helena')) return 'boa-esperanca';
  if(n.includes('romerio')) return 'romerio';
  return state.planos[0] ? state.planos[0].id : '';
}
function parseCsvText(text){
  const clean = text.replace(/^﻿/, '');
  const lines = clean.split(/\r\n|\n/).filter(l=>l.trim().length>0);
  if(lines.length<2) return [];
  const header = lines[0].split(';').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(';');
    const row = {};
    header.forEach((h,i)=>{ row[h] = (cells[i]||'').trim(); });
    return row;
  });
}
function importFromCsvText(text){
  let rows = parseCsvText(text);

  // remove duplicatas dentro do próprio arquivo (mesmo fornecedor + vencimento)
  const seen = new Map();
  rows.forEach(r=>{
    const key = normalizeStr(r['Fornecedor']) + '|' + parseDateBR(r['Vencimento']);
    seen.set(key, r); // mantém a última ocorrência
  });
  rows = Array.from(seen.values());

  let added=0, updated=0, skipped=0;
  const changed = [];
  rows.forEach(r=>{
    const fornecedor = (r['Fornecedor']||'').trim();
    const vencimento = parseDateBR(r['Vencimento']);
    const valor = parseValorBR(r['Valor']);
    const pagamento = parseDateBR(r['Pagamento']);
    const planoTexto = r['Controle'] || r['Plano de contas'] || '';
    const plano = planoFromControle(planoTexto);
    const comentario = (r['Comentario'] || r['Comentário'] || '').trim();
    const contaTexto = normalizeStr(r['Conta de debito'] || r['Conta de débito'] || '');
    const contaMatch = contaTexto ? state.contasCorrentes.find(cc=>normalizeStr(cc.nome)===contaTexto) : null;
    const formaPagamento = formasLabel(parseFormas(r['Forma de pagamento'] || ''));
    const obsPagamento = (r['Observacao do pagamento'] || r['Observação do pagamento'] || '').trim();
    if(!fornecedor || !vencimento || valor==null){ skipped++; return; }
    const match = state.contas.find(c=>
      normalizeStr(c.fornecedor)===normalizeStr(fornecedor) && c.vencimento===vencimento
    );
    if(match){
      if((pagamento && match.pagamento!==pagamento) || match.valor!==valor){
        match.pagamento = pagamento || match.pagamento;
        match.valor = valor;
        changed.push(match);
        updated++;
      } else {
        skipped++;
      }
    } else {
      const novo = {
        id: genId(), fornecedor, valor, plano, tipo:'conta-a-pagar',
        vencimento, pagamento: pagamento || null,
        comentario, contaPagamento: (pagamento && contaMatch) ? contaMatch.id : '',
        formaPagamento: pagamento ? formaPagamento : '',
        obsPagamento: pagamento ? obsPagamento : '',
      };
      state.contas.unshift(novo);
      changed.push(novo);
      added++;
    }
  });
  render();
  if(changed.length>0){
    syncChange(changed, []);
  }
  alert(`Importação concluída:\n${added} despesa(s) adicionada(s)\n${updated} atualizada(s)\n${skipped} já existiam sem mudanças`);
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function escapeAttr(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

if(isUnlocked()){
  render();
  loadData();
} else {
  renderLockScreen();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
